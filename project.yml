name: Pollux

options:
  minimumXcodeGenVersion: 2.45.0
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: 5.10
    MARKETING_VERSION: 0.3.0
    CURRENT_PROJECT_VERSION: 3
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_HARDENED_RUNTIME: YES
    LD_RUNPATH_SEARCH_PATHS:
      - $(inherited)
      - "@executable_path/../Frameworks"

targets:
  Pollux:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
        excludes:
          - "CLI"
      - path: Assets.xcassets
    dependencies:
      - package: Sparkle
    info:
      path: Pollux/Info.plist
      properties:
        CFBundleDisplayName: Pollux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Sparkle auto-update: appcast feed (GitHub Pages) + EdDSA public key. The private key lives in
        # the developer's login Keychain and signs each release via scripts/release-appcast.zsh.
        SUFeedURL: https://mabino.github.io/pollux/appcast.xml
        SUPublicEDKey: nDAE5HXFYg6pBQbAFtyEObXbHu9N7TM+7zUivRcRqNA=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_NAME: Pollux
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mabino.pollux-app
        GENERATE_INFOPLIST_FILE: NO

  pollux-cli:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
        excludes:
          - "PolluxApp.swift"
          - "MainWindowView.swift"
          - "AVPlayerViewContainer.swift"
          - "PlayerWindowView.swift"
          - "ExtractionLogWindowView.swift"
          - "PermissionsRequiredView.swift"
          - "SettingsView.swift"
          - "StreamInfoWindowView.swift"
          - "SupportViews.swift"
          - "PolluxAppModel.swift"
          - "ErrorWindowView.swift"
          - "RecentStreams.swift"
          - "SparkleUpdater.swift"
          - "UpdaterViewModel.swift"
    settings:
      base:
        PRODUCT_NAME: pollux-cli

  PolluxTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: Pollux
    settings:
      base:
        PRODUCT_NAME: PolluxTests
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mabino.pollux.tests

schemes:
  Pollux:
    build:
      targets:
        Pollux: all
        PolluxTests: [test]
    run:
      config: Debug
    test:
      gatherCoverageData: true
      targets:
        - name: PolluxTests
